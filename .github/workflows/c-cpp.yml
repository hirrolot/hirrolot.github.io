name: Build Docs

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11

      - name: Install NodeJS
        run: |
          sudo apt update
          sudo apt install nodejs
          npm install jsdom

      - name: Build the docs
        run: |
          mkdir posts
          make build
          mkdir docs
          mv index.html \
            posts \
            media \
            giscus.html \
            giscus-theme.css \
            style.css \
            script.js \
            rss.xml \
            header.html \
            myself.png \
            fonts \
            docs

      - name: Deploy the docs
        uses: peaceiris/actions-gh-pages@v3
        with:
           github_token: ${{ secrets.GITHUB_TOKEN }}
           publish_dir: ./docs/
